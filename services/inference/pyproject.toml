[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fitted-inference"
version = "0.1.0"
description = "FITTED image-pair inference API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
ml = [
  "pillow>=11,<13",
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
]
vlm = [
  "google-genai>=2.17,<3",
  "pillow>=11,<13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fitted_inference"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
